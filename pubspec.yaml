name: flixora
description: "Flixora — a streaming app UI template inspired by common OTT design patterns."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  video_player: ^2.9.2
  cached_network_image: ^3.4.1
  shared_preferences: ^2.3.3
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  image_picker: ^1.2.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/data/
    - assets/images/
    - assets/animations/
